[workspace]
resolver = "2"
members = [
  "crates/synlexa-bio-core",
  "crates/studio-cli",
  "crates/studio-wasm",
]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Atil Yali <31862341+nanobiolog@users.noreply.github.com>"]
repository = "https://github.com/Synlexa/synlexa-studio"
homepage = "https://www.synlexa.com"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
