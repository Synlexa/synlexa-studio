[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synlexa-studio-sdk"
version = "0.4.2"
description = "Python SDK for Synlexa Studio local deterministic engines and external GPU compute nodes (Research-Use-Only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Atil Yali" }]
keywords = ["synlexa", "structural-biology", "bioinformatics", "cheminformatics", "crispr", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://www.synlexa.com"
Repository = "https://github.com/Synlexa/synlexa-studio"
Documentation = "https://github.com/Synlexa/synlexa-studio/blob/main/docs/sdk-and-mcp.md"
Issues = "https://github.com/Synlexa/synlexa-studio/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["synlexa_sdk*"]
