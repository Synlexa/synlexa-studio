[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synlexa-compute"
version = "0.4.4"
description = "External GPU & HPC Compute Bridge for Synlexa Studio (Research-Use-Only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Atil Yali" }]
dependencies = [
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://www.synlexa.com"
Repository = "https://github.com/Synlexa/synlexa-studio"

[project.optional-dependencies]
server = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]
chemistry = [
  "rdkit>=2024.3",
  "vina>=1.2.5",
  "meeko>=0.5.0", # LGPL-2.1 optional ligand preparation helper
  "pyscf>=2.6.0",
]
simulation = [
  "openmm>=8.1",
  "biopython>=1.83",
]
ai = [
  "boltz>=2.0",
]
ml = [
  "chemprop>=2.0",
]

[project.scripts]
synlexa-compute = "synlexa_compute.server:main"
